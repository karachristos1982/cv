<style id="site-css">
/* Layout: sticky mono nav · split hero (type left, live project map right) · numbered sections on one long page · editor drawer for the owner */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#11161D; --muted:#5A6472; --line:#D8DDE4;
  --accent:#2D4BDB; --accent-2:#D9552F; --accent-soft:rgba(45,75,219,.10); --edge:#BCC4CF;
  /* theme colours: validated categorical order (always shown with a text label) */
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100; --t5:#e87ba4; --t6:#6250d6; --t7:#008300;
  --display:"Commissioner",ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Commissioner",ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:1440px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#161B22; --ink:#E7EBF0; --muted:#97A1AF; --line:#29313B;
  --accent:#8096FF; --accent-2:#FF8B66; --accent-soft:rgba(128,150,255,.14); --edge:#3A4350;
  --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#9085e9; --t7:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --ink:#E7EBF0; --muted:#97A1AF; --line:#29313B;
  --accent:#8096FF; --accent-2:#FF8B66; --accent-soft:rgba(128,150,255,.14); --edge:#3A4350;
  --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#9085e9; --t7:#008300; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18.4px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:13.2px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17.2px;text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
.brand{min-width:0}.brand span{overflow:hidden;text-overflow:ellipsis}
.nav-tools{flex:none}
@media (max-width:440px){.nav .wrap{gap:12px}.brand{font-size:15px}}
.nav-links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{text-decoration:none;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.nav-links a:hover,.nav-links a.on{color:var(--ink);border-bottom-color:var(--accent)}
.nav-tools{display:flex;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip-btn:hover{border-color:var(--ink)}
@media (max-width:760px){.nav-links{display:none}.nav-tools{margin-left:auto}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:64px;padding-block:64px 56px;align-items:center}
.hero-top{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:40px;align-items:stretch;margin-bottom:8px}
.hero-anim{position:relative;min-height:340px;display:grid;place-items:center;padding:150px 16px 28px;border-radius:14px;overflow:hidden;background:radial-gradient(130% 100% at 50% 0%,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 65%);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));cursor:none;touch-action:pan-y}
.av{position:relative;z-index:2;display:grid;justify-items:center;gap:12px;width:min(62%,250px)}
.av-face{position:relative;border:0;padding:0;background:none;width:100%;aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 12px 22px rgba(0,0,0,.18));transition:transform .25s}
.av-face:hover{transform:scale(1.03)}
.av-face:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.av-svg{width:100%;height:100%;display:block}
.av-svg .av-bg{fill:var(--accent-2)}
.av-mo{display:none}.av.open .av-mo{display:inline}.av.open .av-mc{display:none}
.av.talking .av-svg{animation:avBob .5s ease-in-out infinite}
.av-eyes{transform-box:fill-box;transform-origin:center;animation:avBlink 4.2s infinite}
@keyframes avBlink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes avBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-1deg)}}
.av-play{position:absolute;right:4%;bottom:6%;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 0 0 4px var(--surface);transition:transform .2s}
.av-face:hover .av-play{transform:scale(1.12)}
.av.talking .av-play{animation:avPulse 1s ease-out infinite}
@keyframes avPulse{0%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 4px var(--surface),0 0 0 14px transparent}}
.av-tag{display:grid;justify-items:center;gap:4px;text-align:center}
.av-tag span{background:var(--accent-2);color:#fff;font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 14px}
.av-tag b{font-family:var(--display);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.av-bubble{position:absolute;left:50%;bottom:calc(100% + 14px);top:auto;width:min(520px,calc(100vw - 64px));transform:translateX(-50%);text-align:center;background:var(--ink);color:var(--surface);font-size:14.4px;line-height:1.45;padding:12px 16px;border-radius:14px;box-shadow:0 10px 26px -10px rgba(0,0,0,.4);opacity:0;transform-origin:center bottom;transition:opacity .3s,transform .3s;pointer-events:none;min-height:1.45em}
.av-bubble.on{opacity:1;transform:translateX(-50%)}
.av-bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
@media (max-width:640px){.av{width:min(58%,200px)}.av-bubble{font-size:12.6px;padding:10px 12px}.av-tag span{font-size:11.5px;padding:3px 10px}.av-tag b{font-size:13px}.av-play{width:26px;height:26px;font-size:10px}}
@media (prefers-reduced-motion:reduce){.av-eyes,.av.talking .av-svg,.av.talking .av-play{animation:none}}
.hero-sky{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,#5b6577 30%,transparent),transparent 75%);animation:wxSky 60s ease-in-out infinite}
.hero-rain{position:absolute;inset:-20% 0 0 0;z-index:1;pointer-events:none;
  background-image:repeating-linear-gradient(104deg,transparent 0 22px,color-mix(in srgb,var(--accent) 55%,transparent) 22px 23.2px,transparent 23.2px 47px),repeating-linear-gradient(100deg,transparent 0 37px,color-mix(in srgb,var(--ink) 30%,transparent) 37px 38px,transparent 38px 71px);
  background-size:100% 64px,100% 90px;
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 70%,transparent);
  animation:wxRainFall .55s linear infinite,wxRain 60s ease-in-out infinite}
@keyframes wxRainFall{to{background-position:-14px 64px,-14px 90px}}
@keyframes wxRain{0%,30%{opacity:.9}48%{opacity:.25}58%,88%{opacity:0}96%,100%{opacity:.9}}
@keyframes wxSky{0%,30%{opacity:1}60%,85%{opacity:0}100%{opacity:1}}
.hero-mtn .sun{transform-box:view-box;transform-origin:575px 72px;animation:wxSun 60s ease-in-out infinite}
.hero-mtn .sun circle{fill:#f2b33d}
.hero-mtn .sun .rays{stroke:#f2b33d;stroke-width:3;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:wxRays 30s linear infinite}
@keyframes wxSun{0%,34%{transform:translateY(120px);opacity:0}62%,86%{transform:translateY(0);opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes wxRays{to{transform:rotate(360deg)}}
.hero-mtn .clouds{fill:color-mix(in srgb,#8a94a6 30%,var(--surface));stroke:color-mix(in srgb,var(--ink) 35%,transparent);stroke-width:1.4;stroke-linejoin:miter;vector-effect:non-scaling-stroke;animation:wxClouds 60s ease-in-out infinite}
.hero-mtn .clouds path{vector-effect:non-scaling-stroke}
@keyframes wxClouds{0%,32%{opacity:1;transform:translateX(0)}60%,86%{opacity:.15;transform:translateX(40px)}100%{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.hero-rain{animation:none;opacity:0}.hero-sky{animation:none;opacity:0}.hero-mtn .sun,.hero-mtn .sun .rays,.hero-mtn .clouds{animation:none}.hero-mtn .clouds{opacity:.2}}
.hero-mtn{position:absolute;inset:auto 0 0 0;width:100%;height:78%;z-index:0;pointer-events:none}
.hero-mtn .m1{fill:color-mix(in srgb,var(--accent) 9%,transparent)}
.hero-mtn .m2{fill:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.hero-mtn .m3{fill:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.hero-mtn .l1,.hero-mtn .l2,.hero-mtn .l3,.hero-mtn .s1,.hero-mtn .cl{fill:none;stroke-linejoin:miter;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hero-mtn .l1{stroke:color-mix(in srgb,var(--accent) 55%,transparent);stroke-width:1.6}
.hero-mtn .s1{stroke:color-mix(in srgb,var(--accent) 55%,transparent);stroke-width:1.4}
.hero-mtn .l2{stroke:color-mix(in srgb,var(--accent) 70%,transparent);stroke-width:1.6}
.hero-mtn .l3{stroke:var(--accent);stroke-width:1.8}
.hero-mtn .cl{stroke:color-mix(in srgb,var(--accent) 35%,transparent);stroke-width:1.6}
.hero-anim canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-anim-hint{position:absolute;right:14px;bottom:10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.8;pointer-events:none}
@media (max-width:900px){.hero-top{grid-template-columns:1fr;gap:20px}.hero-anim{min-height:0;padding:140px 12px 22px}}
@media (max-width:640px){.hero .lede,.rs-intro{text-align:left}}
@media (max-width:560px){.hero-anim-hint{display:none}}
.hero .lede{max-width:none;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.hero .lede p{margin:0 0 14px}
.hero .lede p:last-child{margin-bottom:0}
.hero-side .idrow{display:block}
.hero-side .avatar{width:240px;height:240px;border-width:5px}
.proj-map{max-width:1000px;margin:0 auto 48px;display:grid;gap:14px}
.proj-map .map{margin:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}.hero-side{order:-1}.hero-side .avatar{width:120px;height:120px}}
.eyebrow{display:flex;gap:14px;color:var(--muted)}
.eyebrow b{color:var(--accent);font-weight:500}
h1.headline{font-family:var(--display);font-weight:650;font-size:clamp(50.6px,6.4vw,96.6px);line-height:1.06;letter-spacing:-.035em;margin:22px 0 26px;text-wrap:balance}
h1.headline span{display:block}
h1.headline em{font-style:normal;color:var(--accent)}
.lede{font-size:clamp(17.5px,1.3vw,20px);line-height:1.6;max-width:36em;margin:0 0 28px;color:color-mix(in srgb,var(--ink) 85%,var(--muted))}
.idcard{display:grid;gap:2px;font-size:16.7px;color:var(--muted)}
.idcard strong{color:var(--ink);font-weight:600;font-size:18.4px}
.idrow{display:flex;align-items:center;gap:20px}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
@media (max-width:560px){.avatar{width:84px;height:84px}}
.avatar-swap{position:relative;display:block;overflow:hidden;cursor:pointer}
.avatar-swap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.avatar-swap .real{opacity:0}
.avatar-swap:hover .real,.avatar-swap:focus-visible .real{opacity:1}
.avatar-swap:hover .px,.avatar-swap:focus-visible .px{opacity:0}
img.px,.avatar-swap .px{image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){.avatar-swap img{transition:none}}
.hero-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;text-decoration:none;font-size:16.1px}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.map{border:1px solid var(--line);background:var(--surface);border-radius:4px;min-width:0}
.map-head,.map-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;color:var(--muted)}
.map-head b{color:var(--accent);font-weight:500}
.map-foot{border-top:1px solid var(--line);min-height:62px;align-items:center;font-size:16.1px;text-transform:none;letter-spacing:0;font-family:var(--body)}
.map-foot .sel-name{font-weight:600;color:var(--ink)}
.map svg{display:block;width:100%;height:auto;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.map .edge{stroke-width:1.3;stroke-opacity:.38;transition:stroke-opacity .2s,stroke-width .2s}
.map .edge.hot{stroke-opacity:1;stroke-width:2.2}
.map .node{cursor:pointer;outline:none}
.map .node text{font-family:var(--mono);font-size:10.9px;fill:var(--muted);letter-spacing:.04em;transition:fill .2s,opacity .2s}
.map .node.proj .dot{fill:var(--muted);stroke:var(--surface);stroke-width:2;transition:fill .2s}
.map .node.proj.hot .dot{fill:var(--ink)}
.map .node.proj.hot text{fill:var(--ink);font-weight:500}
.map .node.theme .halo{fill:var(--c);opacity:.16;transition:opacity .2s,r .2s}
.map .node.theme .dot{fill:var(--c);stroke:var(--surface);stroke-width:2.5}
.map .node.theme .pill{fill:var(--surface);stroke:var(--c);stroke-width:1.5}
.map .node.theme text{fill:var(--ink);font-family:var(--body);font-size:14.4px;font-weight:650;letter-spacing:0}
.map .node.theme.hot .halo{opacity:.32;r:30px}
.map .node.theme.hot .pill{fill:var(--c)}
.map .node.theme.hot text{fill:var(--surface)}
.map .node:focus-visible .dot{stroke:var(--ink);stroke-width:3}
.map.dim .edge:not(.hot){stroke-opacity:.12}
.map.dim .node.proj:not(.hot) text{opacity:.45}
.map.dim .node.theme:not(.hot){opacity:.55}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.tag .swatch{width:8px;height:8px;margin-right:6px;vertical-align:0}

/* publication map */
.pmap{border:1px solid var(--line);background:var(--surface);border-radius:4px;margin-bottom:32px;min-width:0}
.pmap-scroll{overflow-x:auto;padding:8px clamp(16px,4vw,48px)}
.pmap svg{display:block;width:100%;min-width:720px;height:auto}
.pmap .grid{stroke:var(--line);stroke-width:1}
.pmap .yl{font-family:var(--mono);font-size:12.6px;fill:var(--muted);font-variant-numeric:tabular-nums}
.pmap .rl{font-family:var(--body);font-size:15.5px;font-weight:600;fill:var(--ink);cursor:pointer}
.pmap .rt{font-family:var(--mono);font-size:13.8px;fill:var(--muted);font-variant-numeric:tabular-nums}
.pmap .b{fill:var(--c);fill-opacity:.85;stroke:var(--surface);stroke-width:2;transition:fill-opacity .15s}
.pmap .cell{cursor:pointer;outline:none}
.pmap .cell .hit{fill:transparent}
.pmap .cell:hover .b,.pmap .cell:focus-visible .b,.pmap .cell.on .b{fill-opacity:1;stroke:var(--ink)}
.pmap.dim .cell:not(.on) .b{fill-opacity:.25}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:4px;background:var(--surface);margin-bottom:24px}
.strip button{border:0;background:none;text-align:left;padding:14px 16px;display:flex;gap:10px;align-items:baseline;border-right:1px solid var(--line);color:var(--muted)}
.strip button:last-child{border-right:0}
.strip button b{color:var(--muted);font-weight:500}
.strip button:hover,.strip button.hot{color:var(--ink);background:var(--accent-soft)}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding-block:40px 28px}.strip button{border-right:0;border-bottom:1px solid var(--line)}}

/* sections */
section.block{border-top:1px solid var(--line);padding-block:72px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end;margin-bottom:40px}
.sec-head h2{font-family:var(--display);font-weight:650;font-size:clamp(39.1px,4.4vw,64.4px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 0;text-wrap:balance}
.sec-head.full{grid-template-columns:1fr}
.sec-head.full h2{max-width:none;text-wrap:pretty}
.sec-head p{margin:0;color:var(--muted);font-size:19.5px;max-width:40em}
@media (max-width:800px){.sec-head{grid-template-columns:1fr;gap:16px}section.block{padding-block:52px}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.rs-intro{font-size:clamp(17.5px,1.3vw,20px);line-height:1.65;text-align:justify;margin:0 0 36px}
.rs-intro p{margin:0 0 14px}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.rs-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 22px 20px 26px;display:grid;gap:8px;align-content:start;overflow:hidden}
.rs-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.rs-top{display:flex;justify-content:space-between;gap:10px;font-size:12.6px;letter-spacing:.06em;color:var(--muted)}
.rs-top b{color:var(--c);font-weight:600}
.rs-card h3{margin:2px 0 0;font-family:var(--display);font-size:21.8px;font-weight:650;line-height:1.25}
.rs-card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.55}
.tag{font-family:var(--mono);font-size:13.8px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted);background:var(--surface)}

/* projects */

  "org_el": "Ελληνικό Ανοικτό Πανεπιστήμιο · Εργαστήριο Εκπαιδευτικού Υλικού και Εκπαιδευτικής Μεθοδολογίας (ΕΕΥΕΜ)",

  "location_el": "Κως, Ελλάδα",
  "eyebrow_en": "Instructional design / EdTech / Research",
  "eyebrow_el": "Εκπαιδευτικός σχεδιασμός / EdTech / Έρευνα",
  "headline_en": "Educational|*technologist*|& ICT teacher.",
  "headline_el": "Εκπαιδευτικός|*τεχνολόγος*|& καθηγητής|Πληροφορικής.",
  "lede_en": "I am an educational technologist and a permanent Computer Science teacher (ΠΕ86), currently working in Kos, Greece, holding a post at the 1st Vocational High School of Kos, seconded to Kefalos Lower Secondary School for 2026–27, and also teaching at ΣΑΕΚ Kos. Since 2013 I have been designing online courses and MOOCs at the Hellenic Open University, where I served as a scientific associate of the Laboratory of Educational Material and Educational Methodology (ΕΕΥΕΜ) and coordinator of the ΤΟΔΗΜ unit. I have worked on numerous European and national projects (Horizon Europe, Erasmus+, Digital Europe) on extended reality, artificial intelligence, smart toys, STEM, digital credentials and inclusive education.\n\nI have taught since 2009 across the whole spectrum of education: higher education (ΤΕΙ), vocational training (IEK/ΣΑΕΚ), Second Chance Schools, OAED apprenticeship schools, lifelong learning centres and secondary schools, in Western Greece, Epirus and the Dodecanese. I am a PhD candidate at the University of Patras, researching AI-supported learning in online and offline environments, and hold three master's degrees (Digital Communications & Networks; Computational Mathematics & ICT in Education; Special Education). I have authored more than 60 publications, am a teacher trainer for the Institute of Educational Policy (ΙΕΠ), a certified adult educator and Cisco instructor, and my student teams have won awards in robotics (WRO) and open-technology competitions.",
  "lede_el": "Είμαι εκπαιδευτικός τεχνολόγος και μόνιμος καθηγητής Πληροφορικής (ΠΕ86) και αυτή τη στιγμή εργάζομαι στην Κω, με οργανική θέση στο 1ο ΕΠΑΛ Κω και απόσπαση στο Γυμνάσιο Κεφάλου για το 2026–27, ενώ διδάσκω παράλληλα στη ΣΑΕΚ Κω. Από το 2013 σχεδιάζω διαδικτυακά μαθήματα και MOOCs στο Ελληνικό Ανοικτό Πανεπιστήμιο, όπου διετέλεσα επιστημονικός συνεργάτης του Εργαστηρίου Εκπαιδευτικού Υλικού και Εκπαιδευτικής Μεθοδολογίας (ΕΕΥΕΜ) και συντονιστής της μονάδας ΤΟΔΗΜ. Έχω εργαστεί σε πλήθος ευρωπαϊκών και εθνικών έργων (Horizon Europe, Erasmus+, Digital Europe) για την εκτεταμένη πραγματικότητα, την τεχνητή νοημοσύνη, τα έξυπνα παιχνίδια, τα STEM, τα ψηφιακά διαπιστευτήρια και τη συμπεριληπτική εκπαίδευση.\n\nΔιδάσκω από το 2009 σε όλο το φάσμα της εκπαίδευσης: ΤΕΙ, ΙΕΚ/ΣΑΕΚ, Σχολεία Δεύτερης Ευκαιρίας, ΕΠΑ.Σ ΟΑΕΔ, κέντρα διά βίου μάθησης και σχολεία της δευτεροβάθμιας, σε Αιτωλοακαρνανία, Αχαΐα, Ήπειρο και Δωδεκάνησα. Είμαι υποψήφιος διδάκτορας στο Πανεπιστήμιο Πατρών, με έρευνα για τη μάθηση σε διαδικτυακά και μη περιβάλλοντα με τεχνικές ΤΝ, και κάτοχος τριών μεταπτυχιακών (Ψηφιακές Επικοινωνίες & Δίκτυα, Υπολογιστικά Μαθηματικά & ΤΠΕ στην Εκπαίδευση, Ειδική Αγωγή). Έχω περισσότερες από 60 δημοσιεύσεις, είμαι επιμορφωτής του ΙΕΠ, πιστοποιημένος εκπαιδευτής ενηλίκων και εκπαιδευτής Cisco, ενώ ομάδες μαθητών μου έχουν διακριθεί σε διαγωνισμούς ρομποτικής (WRO) και ανοιχτών τεχνολογιών.",
  "research_title_en": "My research field.",
  "research_title_el": "Το ερευνητικό μου πεδίο.",
  "research_text_en": "My research sits at the intersection of instructional design and emerging technology. I am interested in how a new technology, from an extended-reality environment or an AI system to a smart toy or a drone, turns into learning that holds up in real settings: a school classroom, an adult-education group, a massive open online course. In my work the answer lies not in the device but in the design: frameworks and learning scenarios grounded in needs analysis, piloted in practice and evaluated systematically.\n\nMethodologically I combine quantitative and qualitative approaches: systematic literature reviews, technology-acceptance studies (UTAUT), Delphi studies for expert validation of frameworks, learning analytics and correspondence analysis for quality data. The research is fed directly by European projects and by everyday teaching at every level, from early childhood to adult and special education, so that findings return to practice as tools, materials and teacher training.",
  "research_text_el": "Η έρευνά μου κινείται στην τομή του εκπαιδευτικού σχεδιασμού με τις αναδυόμενες τεχνολογίες. Με ενδιαφέρει πώς μια νέα τεχνολογία, από ένα περιβάλλον εκτεταμένης πραγματικότητας ή ένα σύστημα τεχνητής νοημοσύνης μέχρι ένα έξυπνο παιχνίδι ή ένα drone, γίνεται μάθηση που στέκει σε πραγματικές συνθήκες: σε μια σχολική τάξη, σε ένα τμήμα ενηλίκων, σε ένα μαζικό ανοικτό διαδικτυακό μάθημα. Η απάντηση, κατά τη δουλειά μου, δεν βρίσκεται στη συσκευή αλλά στον σχεδιασμό: σε πλαίσια και σενάρια μάθησης που προκύπτουν από ανάλυση αναγκών, δοκιμάζονται πιλοτικά και αξιολογούνται συστηματικά.\n\nΜεθοδολογικά συνδυάζω ποσοτικές και ποιοτικές προσεγγίσεις: συστηματικές βιβλιογραφικές ανασκοπήσεις, μελέτες αποδοχής τεχνολογίας (UTAUT), τεχνικές Delphi για την επικύρωση πλαισίων από εμπειρογνώμονες, αναλυτική μάθησης και ανάλυση αντιστοιχιών για δεδομένα ποιότητας. Η έρευνα τροφοδοτείται άμεσα από ευρωπαϊκά έργα και από την καθημερινή διδασκαλία σε όλες τις βαθμίδες, από την προσχολική ηλικία μέχρι την εκπαίδευση ενηλίκων και την ειδική αγωγή, ώστε τα ευρήματα να επιστρέφουν στην πράξη ως εργαλεία, υλικό και επιμόρφωση εκπαιδευτικών.",
  "bio_en": "I am an instructional designer and educational technology researcher at the Hellenic Open University, where I work as a Course Instructional Designer and Scientific Associate at the Laboratory of Educational Material and Educational Methodology (ΕΕΥΕΜ) and coordinate the ΤΟΔΗΜ unit.\n\nMy research centres on eLearning and smart toys: how digital, immersive and playful technologies can be designed into learning that works. I have authored more than 40 international publications and have contributed to over fifteen Horizon Europe, Erasmus+, Digital Europe and Interreg projects.\n\nI trained as a computing educator at the University of Piraeus and hold master's degrees in digital communications and networks, in computational mathematics and ICT in education, and in special education. Before moving fully into research, I taught computing for many years in vocational schools, second-chance schools and adult education. I am a PhD candidate at the University of Patras, studying how AI techniques can make online learning environments more effective.",
  "bio_el": "Είμαι σχεδιαστής εκπαιδευτικού υλικού και ερευνητής στην εκπαιδευτική τεχνολογία στο Ελληνικό Ανοικτό Πανεπιστήμιο, όπου εργάζομαι ως Course Instructional Designer και Επιστημονικός Συνεργάτης στο Εργαστήριο Εκπαιδευτικού Υλικού και Εκπαιδευτικής Μεθοδολογίας (ΕΕΥΕΜ) και συντονίζω τη μονάδα ΤΟΔΗΜ.\n\nΗ έρευνά μου εστιάζει στην ηλεκτρονική μάθηση και στα έξυπνα παιχνίδια: πώς οι ψηφιακές, εμβυθιστικές και παιγνιώδεις τεχνολογίες μπορούν να σχεδιαστούν ως μάθηση που λειτουργεί. Έχω περισσότερες από 40 διεθνείς δημοσιεύσεις και έχω συμμετάσχει σε περισσότερα από δεκαπέντε έργα Horizon Europe, Erasmus+, Digital Europe και Interreg.\n\nΣπούδασα στο Τμήμα Διδακτικής της Τεχνολογίας και Ψηφιακών Συστημάτων του Πανεπιστημίου Πειραιώς και έχω μεταπτυχιακούς τίτλους στις Ψηφιακές Επικοινωνίες και Δίκτυα, στα Υπολογιστικά Μαθηματικά και ΤΠΕ στην Εκπαίδευση και στην Ειδική Αγωγή. Για πολλά χρόνια δίδαξα πληροφορική σε ΙΕΚ, Σχολεία Δεύτερης Ευκαιρίας και στην εκπαίδευση ενηλίκων. Είμαι υποψήφιος διδάκτορας στο Πανεπιστήμιο Πατρών, με αντικείμενο την αποτελεσματικότητα των περιβαλλόντων διαδικτυακής μάθησης με τεχνικές ΤΝ.",

  if(!s || !(s.citations||s.h||s.i10)) return '';

}

function awardsHTML(){
  const list=(D.cv||[]).filter(c=>c.kind==='award'); if(!list.length) return '';
  const place=c=>{ const m=String(c.title_el||c.title_en||'').match(/(\d)\s*(η|st|nd|rd|th)/i); return m?+m[1]:0 };
  list.sort((a,b)=>(String(b.period).localeCompare(String(a.period)))||place(a)-place(b));
  const medal=p=>p===1?'gold':p===2?'silver':p===3?'bronze':'plain';
  const lab=p=>LANG==='el'?`${p}η`:(p===1?'1st':p===2?'2nd':p===3?'3rd':p+'th');
  const card=c=>{ const p=place(c), t=tx(c,'title').replace(/^\s*\d\s*(η|st|nd|rd|th)\s*(θέση|place)\s*,?\s*/i,'');
    const link=safeUrl(c.url);
    return `<li class="aw-card aw-${medal(p)}"><div class="aw-medal"><span class="aw-ribbon"></span><b>${p?lab(p):'★'}</b><small>${u('awPlace')}</small></div>
      <div class="aw-body"><span class="aw-year mono">${esc(c.period||'')}</span><h4>${esc(t)}</h4><div class="aw-org">${esc(tx(c,'org'))}</div>${tx(c,'desc')?`<p>${esc(tx(c,'desc'))}</p>`:''}${link?`<a class="aw-link mono" href="${esc(link)}" target="_blank" rel="noopener">${u('awSee')} ↗</a>`:''}</div></li>` };
  return `<section class="block" id="awards"><div class="wrap">
    <div class="sec-head full"><div><h2>${u('awTitle')}</h2></div></div>
    <p class="aw-intro">${u('awIntro')}</p>
    <ol class="aw-grid">${list.map(card).join('')}</ol>
  </div></section>`;
}

/* ---------- project map ---------- */
let layout = null;
function computeLayout(){
  const W=640,H=440,cx=W/2,cy=H/2, T=D.themes||[], Pj=D.projects||[];
  const tp = {};
  T.forEach((t,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/Math.max(T.length,1); tp[t.id]={x:cx+Math.cos(a)*168,y:cy+Math.sin(a)*112} });
  // each project sits on an outer ring, at the angle of the themes it links to; angles are then spread evenly
  const want = Pj.map((p,i)=>{
    const ts=(p.themes||[]).filter(id=>tp[id]);
    if(!ts.length) return {i,a:-Math.PI/2+i*2.1};
    const x=ts.reduce((s,id)=>s+(tp[id].x-cx)/150,0), y=ts.reduce((s,id)=>s+(tp[id].y-cy)/112,0);
    return {i,a:(Math.hypot(x,y)<0.05)? -Math.PI/2+i*2.1 : Math.atan2(y,x)};
  }).sort((a,b)=>a.a-b.a);
  const n=want.length, gap=n?Math.min(2*Math.PI/n, 0.62):0;
  const ang=want.map(w=>w.a);
  for(let it=0; it<300; it++){
    let moved=false;
    for(let k=0;k<n;k++){
      const j=(k+1)%n; let d=ang[j]-ang[k]; if(j===0) d+=2*Math.PI;
      if(n>1 && d<gap-1e-4){ const push=(gap-d)/2; ang[k]-=push; ang[j]+=push; moved=true }
    }
    if(!moved) break;
  }
  const pp=[]; want.forEach((w,k)=>{ pp[w.i]={x:cx+Math.cos(ang[k])*222, y:cy+Math.sin(ang[k])*182, c:Math.cos(ang[k]), s:Math.sin(ang[k])} });
  layout = {tp,pp};
}
function drawMap(){
  const svg = document.getElementById('mapSvg'); if(!svg) return;
  computeLayout();
  const {tp,pp} = layout, T=D.themes||[], Pj=D.projects||[];
  let edges='', nodes='';
  Pj.forEach((p,i)=>(p.themes||[]).forEach(id=>{ if(tp[id]) edges+=`<line class="edge" style="stroke:${tColor(id)}" data-p="${i}" data-t="${esc(id)}" x1="${pp[i].x.toFixed(1)}" y1="${pp[i].y.toFixed(1)}" x2="${tp[id].x.toFixed(1)}" y2="${tp[id].y.toFixed(1)}"/>` }));
  T.forEach(t=>{ const q=tp[t.id], below=q.y>220; nodes+=`<g class="node theme" style="--c:${tColor(t.id)}" tabindex="0" role="button" data-theme-id="${esc(t.id)}" aria-label="${u('mapTheme')}: ${esc(t[LANG]||t.en)}"><circle class="halo" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="22"/><circle class="dot" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="9"/><rect class="pill" rx="11"/><text x="${q.x.toFixed(1)}" y="${(q.y+(below?40:-30)).toFixed(1)}" text-anchor="middle">${esc(t['sh_'+LANG]||t[LANG]||t.en)}</text></g>` });
  Pj.forEach((p,i)=>{ const q=pp[i], anchor=q.c>0.35?'start':(q.c<-0.35?'end':'middle'), dx=anchor==='end'?-10:(anchor==='start'?10:0), dy=anchor==='middle'?(q.s>0?19:-11):4;
    nodes+=`<g class="node proj" tabindex="0" role="button" data-p="${i}" aria-label="${u('mapProj')}: ${esc(p.name)}"><circle class="dot" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="4.5"/><text x="${(q.x+dx).toFixed(1)}" y="${(q.y+dy).toFixed(1)}" text-anchor="${anchor}">${esc((p.short||p.name).toUpperCase())}</text></g>` });

    r.setAttribute('x',(b.x-9).toFixed(1)); r.setAttribute('y',(b.y-4).toFixed(1)); r.setAttribute('width',(b.width+18).toFixed(1)); r.setAttribute('height',(b.height+8).toFixed(1)); r.setAttribute('rx',((b.height+8)/2).toFixed(1)); g.parentNode.appendChild(g) });

  else foot.innerHTML=`<span>${u('mapHint')}</span>`;

function startAuto(){

async function copySig(btn, i, short){
  const s=(D.signatures||[])[i]; if(!s) return;
  const html=sigHTML(s,sigLang,short), box=document.createElement('div'); box.innerHTML=html; const tb=box.cloneNode(true); tb.querySelectorAll('br').forEach(x=>x.replaceWith('\n')); tb.querySelectorAll('div,td').forEach(x=>x.append('\n')); const text=tb.textContent.replace(/[ \t]*\n\s*/g,'\n').trim();
  let ok=false;
  try{ if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]); ok=true } }catch(e){}
  if(!ok){ try{ box.style.cssText='position:fixed;left:-9999px;top:0;background:#fff'; document.body.appendChild(box); const r=document.createRange(); r.selectNodeContents(box); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); ok=document.execCommand('copy'); sel.removeAllRanges(); box.remove() }catch(e){} }
  const t=btn.textContent; btn.textContent=ok?'Copied ✓':'Select & copy manually'; setTimeout(()=>btn.textContent=t,1800);
  if(!ok){ const pv=document.getElementById('sigprev'+i); if(pv){ const r=document.createRange(); r.selectNodeContents(pv); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r) } }
}

let PDFBUSY=false;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s) }) }
async function ensurePdfMake(){
  if(window.pdfMake && window.pdfMake.vfs) return window.pdfMake;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js');
  return window.pdfMake;
}
function pdfDocDef(){
  const P=D.profile||{}, el=LANG==='el';
  const L = el ? {proj:'Ευρωπαϊκά και χρηματοδοτούμενα έργα',pubs:'Ερευνητική δραστηριότητα (δημοσιεύσεις)',pl:'Εκπαιδευτική προϋπηρεσία',hours:'ώρες',now:'τρέχον',gen:'Δημιουργήθηκε από τον προσωπικό ιστότοπο',page:'Σελίδα',themes:'Ερευνητικές θεματικές'}
                 : {proj:'European and funded projects',pubs:'Research activity (publications)',pl:'Teaching posts',hours:'hours',now:'current',gen:'Generated from the personal website',page:'Page',themes:'Research themes'};
  const ACC='#2a78d6', MUT='#666666';
  const H = t => ({text:t.normalize('NFD').replace(/\u0301/g,'').toUpperCase().normalize('NFC'),style:'h',margin:[0,16,0,6]});
  const rule = {canvas:[{type:'line',x1:0,y1:0,x2:515,y2:0,lineWidth:.6,lineColor:'#cccccc'}],margin:[0,0,0,4]};
  const c=[];
  const hasPhoto=/^data:image\/(jpeg|png);base64,/.test(P.photo||'');
  const head=[];
  head.push({text:tx(P,'name'),fontSize:22,bold:true});
  head.push({text:tx(P,'role'),fontSize:11.5,color:ACC,margin:[0,2,0,2]});
  head.push({text:tx(P,'org'),fontSize:9.5,color:MUT});
  const contact=[tx(P,'location'), P.email].filter(Boolean).join('  ·  ');
  if(contact) head.push({text:contact,fontSize:9.5,color:MUT,margin:[0,2,0,0]});
  const links=(P.links||[]).filter(l=>safeUrl(l.url));
  if(links.length) head.push({text:links.flatMap((l,i)=>[i?{text:'  ·  ',color:MUT}:'',{text:l.label,link:l.url,color:ACC}]),fontSize:9.5,margin:[0,2,0,0]});
  c.push(hasPhoto?{columns:[{width:'*',stack:head},{width:76,image:P.photo,fit:[76,76],alignment:'right'}],columnGap:12}:{stack:head});
  const intro=tx(P,'research_text')||tx(P,'lede');
  if(intro) c.push({text:intro,fontSize:10,margin:[0,10,0,0]});
  if((D.themes||[]).length) c.push({text:[{text:L.themes+': ',bold:true},(D.themes||[]).map(t=>t[LANG]||t.en).join(' · ')],fontSize:9.5,color:'#333333',margin:[0,6,0,0]});

  // CV kinds
  const row=(period,title,org,desc,url)=>({columns:[
      {width:78,text:period||'',fontSize:9,color:MUT},
      {width:'*',stack:[{text:title,bold:true,fontSize:10,link:safeUrl(url)||undefined},org?{text:org,fontSize:9.5,color:'#333333'}:'',desc?{text:desc,fontSize:9,color:MUT}:''].filter(Boolean)}
    ],columnGap:10,margin:[0,0,0,6],unbreakable:true});
  for(const k of ['education','training',...CV_KINDS,'award']){
    const items=(D.cv||[]).filter(x=>x.kind===k); if(!items.length) continue;
    c.push(H(u('cv_'+k)),rule);
    items.forEach(x=>c.push(row(x.period,tx(x,'title'),tx(x,'org'),tx(x,'desc'),x.url)));
  }
  // placements
  const pls=(D.placements||[]).slice().sort((a,b)=>String(b.years).localeCompare(String(a.years)));
  if(pls.length){
    c.push(H(L.pl),rule);
    pls.forEach(p=>c.push(row(p.years,tx(p,'school'),[tx(p,'town'),tx(p,'role')].filter(Boolean).join(' — '),'',p.url)));
  }
  // projects
  const prs=D.projects||[];
  if(prs.length){
    c.push(H(L.proj),rule);
    prs.forEach(p=>c.push(row(p.years,p.name+(p.programme?'  ('+p.programme+')':''),tx(p,'role'),tx(p,'desc'),p.url)));
  }
  // publications
  const pubs=(D.pubs||[]).slice().sort((a,b)=>(+b.y||0)-(+a.y||0));
  if(pubs.length){
    c.push(H(L.pubs+' — '+pubs.length),rule);
    let yr=null; const ol=[];
    pubs.forEach((p,i)=>{
      if(p.y!==yr){ yr=p.y; c.push({text:String(yr||''),bold:true,fontSize:10,color:ACC,margin:[0,6,0,2]}) }
      const link=safeUrl(p.u);
      c.push({text:[ {text:(p.a?p.a+'. ':''),color:'#333333'}, {text:p.t,bold:true,link:link||undefined}, p.v?{text:'. '+p.v,italics:true,color:MUT}:'', '.' ],fontSize:9.2,margin:[0,0,0,4]});
    });
  }
  const today=new Date().toLocaleDateString(el?'el-GR':'en-GB',{year:'numeric',month:'long',day:'numeric'});
  return {
    pageSize:'A4', pageMargins:[40,40,40,46],
    info:{title:tx(P,'name')+' — CV', author:tx(P,'name')},
    defaultStyle:{font:'Roboto',fontSize:10,lineHeight:1.2},
    styles:{h:{fontSize:10,bold:true,color:ACC,characterSpacing:.6}},
    content:c,
    footer:(cur,tot)=>({columns:[{text:L.gen+' · '+today,fontSize:7.5,color:'#999999'},{text:L.page+' '+cur+' / '+tot,alignment:'right',fontSize:7.5,color:'#999999'}],margin:[40,14,40,0]})
  };
}
async function exportPdf(btn){
  if(PDFBUSY) return; PDFBUSY=true; track('download/cv-pdf-'+LANG);
  const old=btn&&btn.innerHTML; if(btn){ btn.disabled=true; btn.textContent='…' }
  try{
    const pm=await ensurePdfMake();
    const doc=pm.createPdf(pdfDocDef());
    const name=(LANG==='el'?'Karachristos_CV_el':'Karachristos_CV_en')+'.pdf';
    let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads') }catch(e){}
    if(dl){
      const blob=await new Promise(r=>doc.getBlob(r));
      try{ await dl.save({filename:name,data:blob}) }catch(e){ if(e&&e.code!=='declined') console.warn(e) }
    } else doc.download(name);
  }catch(e){ console.error(e); alertless(btn) }
  finally{ PDFBUSY=false; if(btn){ btn.disabled=false; btn.innerHTML=old } }
}
function alertless(btn){ if(btn){ btn.title='PDF failed to load'; } }

async function initRuntime(){
  if(!(window.claude && typeof window.claude.use==='function')) return;
  let art=null; try{ art = await window.claude.use('artifact') }catch(e){}
  if(!art) return;
  let ok = true;
  try{ const usr = await window.claude.use('user'); if(usr && typeof usr.canEdit==='function') ok = await usr.canEdit() }catch(e){}
  if(!ok) return;
  ART = art; EDITABLE = true;
  try{ DL = await window.claude.use('downloads') }catch(e){}
  try{ const st=sessionStorage.getItem('ck-draft'); if(st){ if(st===JSON.stringify(SAVED)) sessionStorage.removeItem('ck-draft'); else statusMsg='An unpublished draft from your last session was found. Open the JSON tab to restore it.' } }catch(e){}
  mountEditorButton();
}

function fieldHTML(obj, spec){
  const [key,label,type,hint]=spec;
  if(type==='row'){ const ks=key.split('|'), ls=label.split('|'); return `<div class="row2">${ks.map((k,i)=>fieldHTML(obj,[k,ls[i],'text'])).join('')}</div>` }
  const id='f_'+key, val=obj[key];
  if(type==='check') return `<div class="field check"><input type="checkbox" id="${id}" data-k="${key}" ${val?'checked':''}><label for="${id}" style="text-transform:none;letter-spacing:0;font-family:var(--body);font-size:14px;color:var(--ink)">${esc(label)}</label></div>`;
  if(type==='select') return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" data-k="${key}">${spec[4].map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select></div>`;
  if(type==='themes'){ const cur = Array.isArray(val) ? val : (key==='th' ? autoThemes(obj) : []); return `<div class="field" data-theme-key="${key}"><label>${esc(label)}</label><div class="tags">${(D.themes||[]).map(t=>`<label class="tag" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-theme-pick="${esc(t.id)}" ${cur.includes(t.id)?'checked':''}>${esc(t.en)}</label>`).join('')}</div></div>` }
  const input = type==='area' ? `<textarea id="${id}" data-k="${key}">${esc(val)}</textarea>` : `<input id="${id}" data-k="${key}" type="${type==='url'?'url':'text'}" value="${esc(val)}">`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${input}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
}
function readForm(root, obj){
  root.querySelectorAll('[data-k]').forEach(el=>{ obj[el.dataset.k] = el.type==='checkbox' ? el.checked : el.value.trim() });
  root.querySelectorAll('[data-theme-key]').forEach(f=>{ obj[f.dataset.themeKey]=[...f.querySelectorAll('[data-theme-pick]')].filter(p=>p.checked).map(p=>p.dataset.themePick) });
  return obj;
}

  const keepScroll = dr.querySelector('.dr-body')?.scrollTop||0;

    <div class="dr-tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>

function wireDrawer(dr){

    dr.querySelectorAll('[data-delok]').forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.delok,1); confirmDel=null; editing=null; statusMsg='Deleted from the preview.'; afterChange() });
    dr.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; afterChange() } });
    const f=q('#edFilter'); if(f) f.oninput=()=>{ const v=f.value.toLowerCase(); dr.querySelectorAll('.ed-item').forEach(li=>li.hidden=!li.dataset.txt.includes(v)) };
    if(editing && editing.kind===kind){
      q('#itemCancel').onclick=()=>{ editing=null; renderDrawer() };
      q('#itemSave').onclick=()=>{
        const obj=readForm(q('#itemForm'), editing.obj);
        const need = kind==='pubs'?obj.t : kind==='projects'?obj.name : kind==='cv'?(obj.title_en||obj.title_el) : kind==='placements'?(obj.school_en||obj.school_el) : (obj.text_en||obj.text_el);
        if(!need){ q('#itemForm').querySelector('input,textarea').focus(); statusMsg='Add a title (or text) before saving.'; document.getElementById('drStatus').textContent=statusMsg; return }
        if(editing.index<0) arr.unshift(obj); else arr[editing.index]=obj;
        editing=null; statusMsg='Saved to the preview. Publish when you are ready.'; afterChange();
      };
    }
  }
  if(tab==='sigs'){
    dr.querySelectorAll('[data-siglang]').forEach(b=>b.onclick=()=>{ sigLang=b.dataset.siglang; renderDrawer() });
    q('#sigEdit').onclick=()=>{ tab='signatures'; renderDrawer() };
    q('#siteUrlIn').onchange=e=>{ const v=e.target.value.trim(); if(v&&!safeUrl(v)) return; D.profile.site_url=v; statusMsg='Website address updated in the preview.'; afterChange() };
    dr.querySelectorAll('[data-copytxt]').forEach(b=>b.onclick=async()=>{ let ok=false; try{ await navigator.clipboard.writeText(b.dataset.copytxt); ok=true }catch(e){} const t=b.textContent; b.textContent=ok?'Copied ✓':'Copy failed'; setTimeout(()=>b.textContent=t,1500) });
    dr.querySelectorAll('[data-sigcopy]').forEach(b=>b.onclick=()=>copySig(b, +b.dataset.sigcopy, b.dataset.short==='1'));
  }
  if(tab==='import'){
    q('#bibGo').onclick=()=>{
      const got=parseBib(q('#bibIn').value), have=new Set((D.pubs||[]).map(p=>norm(p.t)));
      const add=got.filter(p=>p.t && !have.has(norm(p.t)));
      D.pubs=(D.pubs||[]).concat(add);
      statusMsg = got.length ? `Found ${got.length} entr${got.length===1?'y':'ies'}; added ${add.length}${got.length-add.length?`, skipped ${got.length-add.length} already on the site`:''}.` : 'No BibTeX entries found. Check that the text starts with @article{ or similar.';
      afterChange();
    };
  }
  if(tab==='json'){
    q('#jsonGo').onclick=()=>{
      try{ const v=JSON.parse(q('#jsonIn').value); if(!v.profile||!Array.isArray(v.pubs)) throw new Error('missing profile or pubs'); D=v; statusMsg='JSON applied to the preview.'; afterChange() }
      catch(e){ statusMsg='That JSON could not be read ('+e.message+'). Fix it and try again.'; document.getElementById('drStatus').textContent=statusMsg }
    };
    const sg=q('#stashGo'); if(sg) sg.onclick=()=>{ try{ D=JSON.parse(sessionStorage.getItem('ck-draft')); statusMsg='Draft restored to the preview.'; afterChange() }catch(e){} };
  }
}
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9α-ωάέήίόύώϊϋΐΰ]+/g,'');
function parseBib(src){
  const out=[]; const re=/@(\w+)\s*\{\s*[^,]*,/g; let m;
  while((m=re.exec(src))){
    let i=re.lastIndex, depth=1, start=i;
    while(i<src.length && depth>0){ if(src[i]==='{') depth++; else if(src[i]==='}') depth--; i++ }
    const body=src.slice(start,i-1), f={};
    const fre=/(\w+)\s*=\s*/g; let fm;
    while((fm=fre.exec(body))){
      let j=fre.lastIndex, val='';
      if(body[j]==='{'){ let d=1,k=j+1; while(k<body.length&&d>0){ if(body[k]==='{')d++; else if(body[k]==='}')d--; k++ } val=body.slice(j+1,k-1); fre.lastIndex=k }
      else if(body[j]==='"'){ const k=body.indexOf('"',j+1); val=body.slice(j+1,k); fre.lastIndex=k+1 }
      else { const k=body.slice(j).search(/[,}\n]/); val=body.slice(j, k<0?undefined:j+k) }
      f[fm[1].toLowerCase()]=val.replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
    }
    const authors=(f.author||'').split(/\s+and\s+/i).filter(Boolean).map(a=>{
      let last,first; if(a.includes(',')){ [last,first]=a.split(',').map(s=>s.trim()) } else { const p=a.trim().split(' '); last=p.pop(); first=p.join(' ') }
      const ini=(first||'').split(/[\s.-]+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase(); return (ini?ini+' ':'')+last });
    let venue=f.journal||f.booktitle||f.publisher||f.school||'';
    if(venue && f.volume) venue+=' '+f.volume+(f.number?' ('+f.number+')':'');
    if(venue && f.pages) venue+=', '+f.pages.replace(/--?/,'–');
    const url = f.doi ? 'https://doi.org/'+f.doi.replace(/^https?:\/\/(dx\.)?doi\.org\//,'') : (f.url||'');
    out.push({t:f.title||'',a:authors.join(', '),v:venue,y:f.year||'',c:'',u:url,s:false});
  }
  return out;
}
function buildDoc(data){
  const json = JSON.stringify(data,null,1).replace(/</g,'\\u003c');
  const css = document.getElementById('site-css').textContent;
  const js = document.getElementById('site-js').textContent;
  const P=data.profile||{};
  return SKELETON + '<title>' + esc(P.name_en||'Personal site') + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<meta name="description" content="' + esc((P.name_en||'')+': '+(P.role_en||'')) + '">\n' + FONTS +
    '\n<style id="site-css">' + css + '</style>\n<div id="app"></div>\n<script type="application/json" id="site-data">\n' + json + '\n<\/script>\n<script id="site-js">' + js + '<\/script>\n</body></html>';
}
async function publishNow(){
  if(!ART||!dirty) return;
  const btn=document.getElementById('drPublish'); btn.disabled=true; btn.textContent='Publishing…';
  try{ sessionStorage.setItem('ck-draft', JSON.stringify(D)) }catch(e){}
  try{ await ART.publish(buildDoc(D)); try{ sessionStorage.removeItem('ck-draft') }catch(e){} statusMsg='Published. Reloading…'; }
  catch(e){
    const c=e&&e.code;
    if(c==='conflict') statusMsg='A newer version was published elsewhere. The page is reloading; your draft is kept and can be restored from the JSON tab.';
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){ statusMsg='This view is read-only, so changes cannot be published here.'; }
    else if(c==='rate_limited') statusMsg='Publishing too often. Wait a minute and try again.';
    else if(c==='too_large') statusMsg='The site is too large to publish. Remove some content and try again.';
    else statusMsg='Publishing failed ('+(c||'unknown error')+'). Try again in a moment.';
    btn.disabled=false; btn.textContent='Publish changes';
  }
  const s=document.getElementById('drStatus'); if(s) s.textContent=statusMsg;
}
async function exportHTML(){
  if(!DL) return;
  try{ await DL.save({filename:'index.html', data:buildDoc(D)}); statusMsg='index.html saved. Upload it to any web host (GitHub Pages, Netlify, your own server).' }
  catch(e){ statusMsg = (e&&e.code)==='cancelled' ? 'Export cancelled.' : 'Export failed ('+((e&&e.code)||'error')+').' }
  const s=document.getElementById('drStatus'); if(s) s.textContent=statusMsg;
}

render();
initRuntime();
})();
